name: iOS Liquid Glass screenshots

# Собирает приложение на облачном macOS-раннере GitHub (Xcode 26 + симулятор iOS 26),
# прогоняет по экранам через deep links и выкладывает скриншоты как артефакт.
# Apple Developer ($99) НЕ нужен — это симуляторная сборка (без подписи).
# Запускается автоматически при пуше ветки и вручную (вкладка Actions → Run workflow).

on:
  workflow_dispatch:
  push:
    branches: [screenshots/liquid-glass]

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Инлайнится в JS-бандл (Expo) → sessionStore стартует авторизованным → сразу Главная.
      EXPO_PUBLIC_SCREENSHOT: '1'
      BUNDLE_ID: kz.saqtago.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Toolchain
        run: |
          xcodebuild -version
          echo "--- iOS runtimes ---"
          xcrun simctl list runtimes | grep -i ios || true

      - name: Install JS deps
        run: npm ci

      - name: Prebuild iOS native project (+ pods)
        run: npx expo prebuild -p ios

      - name: Resolve workspace & scheme
        id: xc
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          # Схема приложения у Expo совпадает с именем .xcworkspace (SaqtaGo).
          # НЕ берём первую из -list: там первой может быть pod-схема (EXApplication).
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Workspace=$WS  Scheme=$SCHEME"

      - name: Pick & boot an iOS 26 iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt,devs in d.items():
              if 'iOS-26' not in rt:
                  continue
              for dev in devs:
                  if dev.get('isAvailable') and 'iPhone' in dev['name']:
                      print(dev['udid']); sys.exit(0)
          sys.exit(0)
          ")
          if [ -z "$UDID" ]; then
            echo 'No available iOS 26 iPhone simulator:'; xcrun simctl list devices; exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl ui "$UDID" appearance light || true

      - name: Build for simulator (Release → JS-бандл вшит, Metro не нужен)
        run: |
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          test -d build/Build/Products/Release-iphonesimulator

      - name: Install, launch (Главная) & screenshot
        run: |
          U="${{ steps.sim.outputs.udid }}"
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" -type d | head -1)
          echo "App bundle: $APP"
          if [ -z "$APP" ]; then echo "No .app found:"; ls -R build/Build/Products | head -60; exit 1; fi
          mkdir -p artifacts
          xcrun simctl install "$U" "$APP"
          # короткое видео всего прохода
          ( xcrun simctl io "$U" recordVideo --codec h264 artifacts/walkthrough.mp4 & echo $! > rec.pid ) || true
          xcrun simctl launch "$U" "$BUNDLE_ID"
          sleep 22
          xcrun simctl io "$U" screenshot artifacts/01-home.png

      - name: Tour screens via deep links
        run: |
          U="${{ steps.sim.outputs.udid }}"
          shoot() { sleep "$1"; xcrun simctl io "$U" screenshot "artifacts/$2"; echo "shot $2"; }
          xcrun simctl openurl "$U" "saqtago://box/b1";     shoot 6 02-box-reserve.png
          xcrun simctl openurl "$U" "saqtago://booking/b1"; shoot 6 03-booking.png
          xcrun simctl openurl "$U" "saqtago://order/o1";   shoot 6 04-order.png
          xcrun simctl openurl "$U" "saqtago://filters";    shoot 5 05-filters.png
          # остановить запись видео
          if [ -f rec.pid ]; then kill -INT "$(cat rec.pid)" 2>/dev/null || true; sleep 3; fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-screenshots
          path: artifacts/**
          if-no-files-found: warn
